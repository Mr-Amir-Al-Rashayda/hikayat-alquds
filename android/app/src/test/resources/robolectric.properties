# Run the JVM tests against the API 35 framework.
#
# Robolectric's API 36 sandbox requires Java 21, and this project builds on
# Java 17 (the version AGP 8 targets). Nothing under test is API-36-specific -
# these tests exercise Room, the bundled JSON and the mappers - so pinning the
# emulated framework one level back costs no coverage and keeps the build on a
# single JDK.
sdk=35
